services:
  # Service for the university-project application
  university-project:
    build: ./university-project/back
    container_name: university-project-back
    command: uvicorn src.main:app --reload --host 0.0.0.0 --port 8002
    volumes:
      - ./university-project/back:/usr/src/app
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8002"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      university-project-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - university-project-network

  redis:
    container_name: redis
    image: redis:7.2
    networks:
      - university-project-network
    ports:
      - 6389:6379
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MongoDB for university-project
  university-project-db:
    image: mongo
    container_name: university-project-mongo
    ports:
      - "27020:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - MONGO_INITDB_DATABASE=university
    networks:
      - university-project-network
    volumes:
      - university-project-db-data:/data/db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Mongo Compass for database management
  mongo-compass:
    image: mongo-express
    container_name: mongo-compass
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://admin:admin@university-project-db:27017/
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=admin
    depends_on:
      university-project-db:
        condition: service_healthy
    networks:
      - university-project-network
    restart: always

  # Service for the university-project front
  university-project-front:
    build: ./university-project/front
    container_name: university-project-front
    # Serve the verified Nuxt output so the dashboard does not depend on the
    # development HMR server or its transient build metadata files.
    command: node .app/.output/server/index.mjs
    working_dir: /usr/src/app
    volumes:
      - ./university-project/front:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.app/node_modules
      - /usr/src/app/.app/.nuxt
      - /usr/src/app/.app/.output
    ports:
      - "80:3000"
      - "3000:3000"
    env_file: ./university-project/front/.app/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    depends_on:
      university-project:
        condition: service_healthy
      university-project-db:
        condition: service_healthy
    networks:
      - university-project-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: always

networks:
  university-project-network:
    driver: bridge

volumes:
  # Volume for university-project MongoDB data
  university-project-db-data:

  redis_data:
